<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </radialGradient>

    <!-- Neon Cyan-Blue Gradient -->
    <linearGradient id="cyanBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Glowing Pink-Purple Gradient -->
    <linearGradient id="glowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Subtle Shadow -->
    <filter id="boxShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Squircle Base with border -->
  <rect x="24" y="24" width="464" height="464" rx="110" fill="url(#bgGrad)" filter="url(#boxShadow)" />
  <rect x="24" y="24" width="464" height="464" rx="110" fill="none" stroke="url(#cyanBlueGrad)" stroke-width="4" stroke-opacity="0.5" />

  <!-- Briefcase Handle -->
  <path d="M196 150 V118 C196 100 210 86 228 86 H284 C302 86 316 100 316 118 V150" 
        fill="none" stroke="url(#cyanBlueGrad)" stroke-width="20" stroke-linecap="round" filter="url(#neonGlow)"/>

  <!-- Briefcase Outer Body -->
  <rect x="96" y="150" width="320" height="250" rx="36" fill="#111827" fill-opacity="0.8" stroke="url(#cyanBlueGrad)" stroke-width="12" filter="url(#neonGlow)"/>

  <!-- Briefcase Flap / Top Divider -->
  <path d="M96 230 C180 260 332 260 416 230" fill="none" stroke="url(#cyanBlueGrad)" stroke-width="8" opacity="0.7"/>

  <!-- Iconic 'J' & 'C' Interconnected Network / Nodes -->
  <!-- 'J' Node Line -->
  <path d="M 210 190 V 300 C 210 335 175 345 155 330" 
        fill="none" stroke="#38bdf8" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)"/>
  
  <!-- 'C' Node Arc -->
  <path d="M 345 235 C 330 200 260 200 245 250 C 235 285 245 335 310 340 C 335 340 350 325 355 315" 
        fill="none" stroke="#c084fc" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)"/>

  <!-- Connection Link between J and C -->
  <path d="M 210 250 H 260" fill="none" stroke="#818cf8" stroke-width="10" stroke-linecap="round" filter="url(#neonGlow)"/>

  <!-- Glowing Constellation Nodes / Dots -->
  <circle cx="210" cy="190" r="12" fill="#38bdf8" filter="url(#neonGlow)"/>
  <circle cx="210" cy="250" r="10" fill="#67e8f9" filter="url(#neonGlow)"/>
  <circle cx="155" cy="330" r="12" fill="#38bdf8" filter="url(#neonGlow)"/>
  <circle cx="345" cy="235" r="12" fill="#e879f9" filter="url(#neonGlow)"/>
  <circle cx="260" cy="250" r="10" fill="#a855f7" filter="url(#neonGlow)"/>
  <circle cx="355" cy="315" r="12" fill="#c084fc" filter="url(#neonGlow)"/>
  <circle cx="310" cy="340" r="10" fill="#f43f5e" filter="url(#neonGlow)"/>

  <!-- Sparkle Accent in top right -->
  <path d="M375 180 L380 195 L395 200 L380 205 L375 220 L370 205 L355 200 L370 195 Z" fill="#38bdf8" filter="url(#neonGlow)"/>
</svg>
